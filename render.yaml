# One-click free hosting on Render: dashboard -> New -> Blueprint -> pick this repo + branch.
# Creates the website (Docker, from ./gcc-portal) and a Postgres database, loads the starter data on first boot.
services:
  - type: web
    name: gcc-intel
    runtime: docker
    plan: free
    dockerContext: ./gcc-portal
    dockerfilePath: ./gcc-portal/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: gcc-intel-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: BILLING_WEBHOOK_SECRET
        generateValue: true
      - key: BILLING_MODE
        value: test            # plans switchable from the dashboard; no payments. Change to "live" when payments exist.
      - key: SEED_DATA
        value: "1"             # loads the starter dataset once, when the database is empty
      - key: ADMIN_EMAILS
        sync: false            # you will be asked: the email that becomes admin when you sign up with it
      - key: SITE_URL
        value: https://gcc-intel.onrender.com   # edit if Render gives you a different address
databases:
  - name: gcc-intel-db
    plan: free
    databaseName: gcc
    user: gcc
