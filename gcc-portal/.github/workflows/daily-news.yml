# GitHub only runs workflows from <repo root>/.github/workflows. When gcc-portal becomes its own repo this file works as is.
# While it sits inside another repo, the root-level copy (gcc-portal-daily-news.yml) is the one that runs.
name: daily-news
on:
  schedule:
    - cron: "30 0 * * *"        # 06:00 IST every day
  workflow_dispatch:
concurrency:
  group: gcc-portal-daily-news
  cancel-in-progress: false
jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: pip install -r workers/requirements.txt
      - name: Run
        run: bash workers/run_weekly.sh news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
