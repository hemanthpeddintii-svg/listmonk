# GitHub only runs workflows from <repo root>/.github/workflows. When gcc-portal becomes its own repo this file works as is.
# While it sits inside another repo, the root-level copy (gcc-portal-weekly-digest.yml) is the one that runs.
name: weekly-digest
on:
  schedule:
    - cron: "30 1 * * 1"        # Monday 07:00 IST (= Monday 01:30 UTC)
  workflow_dispatch:
concurrency:
  group: gcc-portal-weekly-digest
  cancel-in-progress: false
jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: pip install -r workers/requirements.txt
      - name: Run
        run: bash workers/run_weekly.sh digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
