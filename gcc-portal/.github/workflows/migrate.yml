# GitHub only runs workflows from <repo root>/.github/workflows. When gcc-portal becomes its own repo this file works as is.
# While it sits inside another repo, the root-level copy (gcc-portal-migrate.yml) is the one that runs.
name: migrate-db
# Manual: apply db/schema.sql to the production database (idempotent). Use after pulling schema changes
# when the web app runs somewhere that does not migrate at boot (for example Vercel).
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node scripts/migrate.mjs
        working-directory: web
        env:
          SCHEMA_PATH: ${{ github.workspace }}/db/schema.sql
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
