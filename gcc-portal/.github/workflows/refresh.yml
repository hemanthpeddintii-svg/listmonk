# NOTE: GitHub only runs workflows from .github/ at the repo root; move this file there
# when gcc-portal becomes its own repo.
name: refresh-gcc-data
on:
  schedule: [{ cron: "0 20 */3 * *" }]   # every 3 days
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r workers/requirements.txt
      - run: python workers/refresh.py
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
