# Root-level copy of gcc-portal/.github/workflows/weekly-refresh.yml. GitHub only reads workflows from the repository root,
# so this copy is the one that actually runs while gcc-portal lives inside the listmonk repo.
# Every step runs in ./gcc-portal. Names are prefixed 'gcc-portal' so they never clash with listmonk's own workflows.
name: gcc-portal weekly-refresh
on:
  schedule:
    - cron: "0 21 * * 6"        # Sunday 02:30 IST (= Saturday 21:00 UTC)
  workflow_dispatch:
concurrency:
  group: gcc-portal-weekly-refresh
  cancel-in-progress: false
defaults:
  run:
    working-directory: gcc-portal
jobs:
  weekly-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gcc-portal/workers/requirements.txt
      - run: pip install -r workers/requirements.txt
      - name: Run
        run: bash workers/run_weekly.sh refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ATS_BUDGET: "1500"
          ENRICH_LIMIT: "300"
