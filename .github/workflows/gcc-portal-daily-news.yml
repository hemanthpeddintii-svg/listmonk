# Root-level copy of gcc-portal/.github/workflows/daily-news.yml. GitHub only reads workflows from the repository root,
# so this copy is the one that actually runs while gcc-portal lives inside the listmonk repo.
# Every step runs in ./gcc-portal. Names are prefixed 'gcc-portal' so they never clash with listmonk's own workflows.
name: gcc-portal daily-news
on:
  schedule:
    - cron: "30 0 * * *"        # 06:00 IST every day
  workflow_dispatch:
concurrency:
  group: gcc-portal-daily-news
  cancel-in-progress: false
defaults:
  run:
    working-directory: gcc-portal
jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gcc-portal/workers/requirements.txt
      - run: pip install -r workers/requirements.txt
      - name: Run
        run: bash workers/run_weekly.sh news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
