# Root-level copy of gcc-portal/.github/workflows/weekly-digest.yml. GitHub only reads workflows from the repository root,
# so this copy is the one that actually runs while gcc-portal lives inside the listmonk repo.
# Every step runs in ./gcc-portal. Names are prefixed 'gcc-portal' so they never clash with listmonk's own workflows.
name: gcc-portal weekly-digest
on:
  schedule:
    - cron: "30 1 * * 1"        # Monday 07:00 IST (= Monday 01:30 UTC)
  workflow_dispatch:
concurrency:
  group: gcc-portal-weekly-digest
  cancel-in-progress: false
defaults:
  run:
    working-directory: gcc-portal
jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gcc-portal/workers/requirements.txt
      - run: pip install -r workers/requirements.txt
      - name: Run
        run: bash workers/run_weekly.sh digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
